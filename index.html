<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <title>Party Games</title>
    <meta name="description" content="Heads Up, Charades and Undercover — a party games app for your phone, with words written fresh every round." />
    <meta name="theme-color" content="#0a0912" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Party Games" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <style>
      html { background: #0a0912; }
      @media (prefers-color-scheme: light) { html { background: #f6f3ff; } }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; }
      #boot span {
        width: 34px; height: 34px; border-radius: 50%;
        border: 3px solid rgba(124, 92, 255, 0.25); border-top-color: #7c5cff;
        animation: bs 0.8s linear infinite;
      }
      @keyframes bs { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="app"><div id="boot"><span></span></div></div>
    <noscript style="display:block;padding:2rem;font-family:system-ui;color:#fff">
      Party Games needs JavaScript to run.
    </noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
